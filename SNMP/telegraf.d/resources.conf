[[inputs.snmp]]
  agents = [ "10.250.249.165" ]
  version = 3
  sec_name = "${SNMP_SEC_NAME}"
  auth_protocol = "MD5"
  auth_password = "${SNMP_AUTH_PASS}"
  sec_level = "authPriv"
  priv_protocol = "DES"
  priv_password = "${SNMP_PRIV_PASS}"
  timeout = "5s"
  retries = 3

  name_override = "juniper_resources"

  #cpu, temp

  [[inputs.snmp.field]]
    name = "cpu_usage"
    oid  = "1.3.6.1.4.1.2636.3.1.13.1.8.9.1.0.0"

  [[inputs.snmp.field]]
    name = "temp_fpc0"
    oid  = "1.3.6.1.4.1.2636.3.1.13.1.7.7.1.0.0"

  [[inputs.snmp.field]]
    name = "temp_routing_engine"
    oid  = "1.3.6.1.4.1.2636.3.1.13.1.7.9.1.0.0"

  # psu0

  [[inputs.snmp.field]]
    name = "psu0_power_watts"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.4.1.3.22.1.0.0"

  [[inputs.snmp.field]]
    name = "psu0_voltage_volts"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.4.1.9.0"

  [[inputs.snmp.field]]
    name = "psu0_current_amps"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.4.1.5.22.1.0.0"

  [[inputs.snmp.field]]
    name = "psu0_temperature_c"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.3.1.1.22.1.0.0"

  [[inputs.snmp.field]]
    name = "psu0_model"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.4.1.2.22.1.0.0"
    is_tag = true

  # psu ogólne


  [[inputs.snmp.field]]
    name = "psu_total_power_capacity"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.1.2.0"

  [[inputs.snmp.field]]
    name = "psu_total_power_used"
    oid  = "1.3.6.1.4.1.2636.3.58.1.2.1.9.0"

  # info

  [[inputs.snmp.field]]
    name = "sysDescr"
    oid  = "1.3.6.1.2.1.1.1.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "sysName"
    oid  = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "sysObjectID"
    oid  = "1.3.6.1.2.1.1.2.0"
    is_tag = true
