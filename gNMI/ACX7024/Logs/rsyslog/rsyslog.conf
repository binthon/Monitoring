module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514")
input(type="imtcp" port="514")

# (debug) zostaw na razie echo do stdout, żeby widzieć każde wejście
module(load="omstdout")
action(type="omstdout")

# Forward do Promtaila – TCP, bez tcp_framing (newline)
action(
  type="omfwd"
  target="172.0.0.5"   # UŻYJ dokładnie nazwy kontenera Promtail
  port="1514"
  protocol="tcp"
  Template="RSYSLOG_SyslogProtocol23Format"
  keepalive="on"
  queue.type="LinkedList"
  queue.size="10000"
  action.resumeRetryCount="-1"
)
