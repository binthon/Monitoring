server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki_acx7024:3100/loki/api/v1/push 
    tenant_id: acx7024

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: syslog_juniper
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: tcp
      idle_timeout: 60s
      label_structured_data: yes
      labels:
        source: juniper
        device: acx7024
        proto: syslog
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: host
      - source_labels: ['__syslog_message_app_name']
        target_label: app
