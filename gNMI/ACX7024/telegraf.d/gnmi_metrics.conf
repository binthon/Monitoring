### OPTICAL 

[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = false
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5

  tagexclude   = ["path","host","system_id"]  

  fieldexclude = [
    "form_factor", "form_factor_preconf",
    "connector_type",
    "vendor*", "serial_no", "date_code",
    "ethernet_pmd*", "sonet_sdh_compliance_code", "otn_compliance_code",
    "module_functional_type",
    "enabled", "present",
    "fault_condition",
    "fec_mode", "fec_status",
    "fec_corrected_bits", "fec_uncorrectable_blocks",
    "description",
    "tx_laser",
    "associated_optical_channel",
    "target_output_power",
    "output_frequency",
    "index"                 
  ]



  [[inputs.gnmi.subscription]]
    name = "OPTICAL_POWER"
    path = "/components/component[name=*]/transceiver/state"
    sample_interval = "60s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "OPTICAL_FREQUENCY"
    path = "/components/component/transceiver/physical-channels/channel/state"
    sample_interval = "60s"
    subscription_mode = "sample"

