### INTERFACES and SUBINTERFACES
 [[inputs.gnmi]]
   addresses = [ "${ACX_ADDRESSES}" ]
   username = "${GNMI_USERNAME}"
   password = "${GNMI_PASSWORD}"
   tls_enable = false
   insecure_skip_verify = true
   encoding = "proto"
   redial = "60s"
   path_guessing_strategy = "subscription"
   depth = 5

   tagexclude = [
     "path",
     "host",
     "system_id"
   ]
   fieldexclude = [
     "name",
     "hardware-port",
     "physical-channel",
     "init-time",
     "parent-ae-name",
     "enabled",
     "management",
     "cpu"
   ]


   [[inputs.gnmi.subscription]]
     name = "INTERFACES_COUNTERS"
     path = "/interfaces/interface/state/counters"
     sample_interval = "30s"
     subscription_mode = "sample"
     alias = "interfaces_counters"

   [[inputs.gnmi.subscription]]
     name = "INTERFACES_TRANSCEIVER"
     path = "/interfaces/interface/state/transceiver"
     sample_interval = "30s"
     subscription_mode = "sample"
     alias = "interfaces_transceiver"

    [[inputs.gnmi.subscription]]
      name = "SUBINTERFACES_STATE"
      path = "/interfaces/interface/subinterfaces/subinterface/state"
      sample_interval = "30s"
      subscription_mode = "sample"

    [[inputs.gnmi.subscription]]
      name = "SUBINTERFACES_COUNTERS"
      path = "/interfaces/interface/subinterfaces/subinterface/state/counters"
      sample_interval = "30s"
      subscription_mode = "sample"


[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = false
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5

  tagexclude = [
    "path",
    "host",
    "identifier",
  ]

  fieldexclude = [
    "enabled",
    "messages/*",
    "route_flap_damping",
    "description",
    "auth_password",
    "import_eval_pending",
    "import_eval",
    "interface_error",
    "dynamically_configure"
  ]
  ### BGP
  [[inputs.gnmi.subscription]]
    name = "BGP_STATE"
    path = "/network-instances/network-instance[name=*]/protocols/protocol[identifier=BGP][name=*]/bgp/neighbors/neighbor[neighbor-address=*]/state"
    sample_interval = "45s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "BGP_SESSION_STATE"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"
    sample_interval = "45s"
    subscription_mode = "sample"

