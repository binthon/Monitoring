## RESOURCES and OPTICAL

[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = false
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5

  tagexclude   = ["path","host","system_id"]  

  fieldexclude = [
    "start_time",
    "cpu_usage_system",
    "cpu_usage_user",
    "serial_no",
    "part_no",
    "id",
    "alarm_status",
    "type",
    "removable",
    "parent",
    "empty",
    "description",
    "description",
    "switchover_ready",
    "last_switchover",
    "last_reboot_time",
    "last_reboot_reason",
    "mfg_name",
    "mfg_date",
    "equipment_failure",
    "equipment_mismatch",
    "id",
    "hardware_version",
    "alarm_status",
    "alarm_threshold",
    "form_factor", 
    "form_factor_preconf",
    "connector_type",
    "vendor*", 
    "serial_no", 
    "date_code",
    "ethernet_pmd*", 
    "sonet_sdh_compliance_code", 
    "otn_compliance_code",
    "module_functional_type",
    "enabled", 
    "present",
    "fault_condition",
    "fec_mode", 
    "fec_status",
    "fec_corrected_bits", 
    "fec_uncorrectable_blocks",
    "description",
    "tx_laser",
    "associated_optical_channel",
    "target_output_power",
    "output_frequency",
    "index"                 

  ]

  [[inputs.gnmi.subscription]]
    name = "COMPONENT_STATE"
    path = "/components/component/state"
    sample_interval = "60s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "PROCESSES"
    path = "/system/processes/process/state"
    sample_interval = "180s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "OPTICAL_POWER"
    path = "/components/component[name=*]/transceiver/state"
    sample_interval = "60s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "OPTICAL_FREQUENCY"
    path = "/components/component/transceiver/physical-channels/channel/state"
    sample_interval = "60s"
    subscription_mode = "sample"

### QUEUE
[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = false
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5

  
  tagexclude   = ["path","host"]  

  fieldexclude = [
    "queue/name",
    "queue/state/name",
  ]

  [[inputs.gnmi.subscription]]
    path = "/qos/interfaces/interface/output/queues"
    sample_interval = "15s"
    subscription_mode = "sample"
    name = "QUEUE_STATE"


  [[inputs.gnmi.subscription]]
    name = "QUEUE_NAME"
    path = "/qos/interfaces/interface/output/queues/queue/state/queue-management-profile"
    sample_interval = "15s"
    subscription_mode = "sample"

### ARP
[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = false
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5


  tagexclude   = ["path","host"]

  fieldexclude = [ 
    "host_name",
    "table_id",
    "is_publish",
    "expiry",
    "ip"
  ]
  [[inputs.gnmi.subscription]]
    name = "ARP_Neighbors"
    path = "/interfaces/interface/subinterfaces/subinterface/ipv4/neighbors/neighbor/state"
    sample_interval = "15s"
    subscription_mode = "sample"

