[[inputs.gnmi]]
  addresses = [ "${ACX_ADDRESSES}" ]
  username = "${GNMI_USERNAME}"
  password = "${GNMI_PASSWORD}" 
  tls_enable = true
  insecure_skip_verify = true
  encoding = "proto"
  redial = "60s"
  path_guessing_strategy = "subscription"
  depth = 5

### INTERFACES
  [[inputs.gnmi.subscription]]
    name = "INTERFACES_COUNTERS"
    path = "/interfaces/interface/state/counters"
    sample_interval = "30s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "INTERFACES_HWPORT"
    path = "/interfaces/interface/state/hardware-port"
    sample_interval = "30s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "INTERFACES_NAME"
    path = "/interfaces/interface/name"
    sample_interval = "30s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "INTERFACES_TRANSCEIVER"
    path = "/interfaces/interface/state/transceiver"
    sample_interval = "30s"
    subscription_mode = "sample"
  
  [[inputs.gnmi.subscription]]
    name = "PHYSICAL_CHANNEL"
    path = "/interfaces/interface/state/physical-channel"
    sample_interval = "30s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
  name = "IF_INIT_TIME"
    path = "/interfaces/interface/init-time"
    sample_interval = "60s"
    subscription_mode = "sample"
    alias = "interface_init_time"


### SUBINTERFACES

  [[inputs.gnmi.subscription]]
    name = "SUBINTERFACES_DATA"
    path = "/interfaces/interface/subinterfaces"
    sample_interval = "10s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "SUBINTERFACES"
    path = "/interfaces/interface/subinterfaces/subinterface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

### QUEUE

  [[inputs.gnmi.subscription]]
    name = "QUEUE"
    path = "/qos/interfaces/interface/output/queues"
    subscription_mode = "sample"
    sample_interval = "60s"
    suppress_redundant = true

### TEMP
  [[inputs.gnmi.subscription]]
    name = "TEMP"
    path = "/components/component/state/temperature"
    sample_interval = "60s"
    subscription_mode = "sample"

### COMPONENET
  [[inputs.gnmi.subscription]]
    name = "COMPONENT_STATE"
    path = "/components/component/state"
    sample_interval = "60s"
    subscription_mode = "sample"

### BGP
  [[inputs.gnmi.subscription]]
    name = "BGP_STATE"
    path = "/network-instances/network-instance[name=*]/protocols/protocol[identifier=BGP][name=*]/bgp/neighbors/neighbor[neighbor-address=*]/state"
    sample_interval = "10s"
    subscription_mode = "sample"

  [[inputs.gnmi.subscription]]
    name = "BGP_SESSION_STATE"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"
    sample_interval = "10s"
    subscription_mode = "sample"

