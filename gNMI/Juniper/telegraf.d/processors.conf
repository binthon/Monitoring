[[processors.converter]]
  namepass = ["BGP_STATE"]
  [processors.converter.fields]
    float = ["last_established"]

[[processors.starlark]]
  namepass = ["BGP_STATE"]
  source = '''
def apply(metric):
  if "last_established" in metric.fields:
    metric.fields["last_established"] = float(metric.fields["last_established"]) / 1e9
  return metric
'''

[[processors.starlark]]
  namepass = ["INTERFACES_PHYSICAL_CHANNEL"]
  source = '''
def apply(metric):
  channels = metric.fields.get("physical-channel", [])
  if channels:
    metric.fields["physical_channel_count"] = len(channels)
  return metric
'''
