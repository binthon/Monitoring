[[inputs.snmp]]
  agents = [ "10.250.249.165" ]
  version = 3
  sec_name = "${SNMP_SEC_NAME}"
  auth_protocol = "MD5"
  auth_password = "${SNMP_AUTH_PASS}"
  sec_level = "authPriv"
  priv_protocol = "DES"
  priv_password = "${SNMP_PRIV_PASS}"
  timeout = "5s"
  retries = 3

  name_override = "juniper_resources"

  [[inputs.snmp.field]]
    name = "temp_fpc0"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.7.7.1.0.0"  

  [[inputs.snmp.field]]
    name = "temp_routing_engine"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.7.9.1.0.0"  

  [[inputs.snmp.field]]
    name = "volt_routing_engine"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.21.9.1.0.0"  

  [[inputs.snmp.field]]
    name = "current_routing_engine"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.20.9.1.0.0" 

  [[inputs.snmp.field]]
    name = "component_descr"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.5.9.1.0.0"  
    is_tag = true
