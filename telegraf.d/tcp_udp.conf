[[inputs.snmp]]
  agents = [ "10.250.249.165" ]
  version = 3
  sec_name = "${SNMP_SEC_NAME}"
  auth_protocol = "MD5"
  auth_password = "${SNMP_AUTH_PASS}"
  sec_level = "authPriv"
  priv_protocol = "DES"
  priv_password = "${SNMP_PRIV_PASS}"
  timeout = "5s"
  retries = 3

  name_override = "juniper_tcp_udp"

    # aktywne tcp
  [[inputs.snmp.field]]
    name = "tcpCurrEstab"
    oid = "1.3.6.1.2.1.6.9.0"

  # odebrane segmenty TCP 
  [[inputs.snmp.field]]
    name = "tcpInSegs"
    oid = "1.3.6.1.2.1.6.10.0"

  # wysłane segmenty TCP 
  [[inputs.snmp.field]]
    name = "tcpOutSegs"
    oid = "1.3.6.1.2.1.6.11.0"

  # aktywne otwarcia TCP
  [[inputs.snmp.field]]
    name = "tcpActiveOpens"
    oid = "1.3.6.1.2.1.6.5.0"

  # pasywne otwarcia (nasłuchujące) TCP
  [[inputs.snmp.field]]
    name = "tcpPassiveOpens"
    oid = "1.3.6.1.2.1.6.6.0"

  # nieudane połaczenia tcp
  [[inputs.snmp.field]]
    name = "tcpAttemptFails"
    oid = "1.3.6.1.2.1.6.7.0"

  # reset w stanie ESTABLISHED
  [[inputs.snmp.field]]
    name = "tcpEstabResets"
    oid = "1.3.6.1.2.1.6.8.0"

  # restransmisje tcp
  [[inputs.snmp.field]]
    name = "tcpRetransSegs"
    oid = "1.3.6.1.2.1.6.12.0"

  # error cehcksum
  [[inputs.snmp.field]]
    name = "tcpInErrs"
    oid = "1.3.6.1.2.1.6.14.0"

  # resety tcp
  [[inputs.snmp.field]]
    name = "tcpOutRsts"
    oid = "1.3.6.1.2.1.6.15.0"

  # algorym retransmisji
  [[inputs.snmp.field]]
    name = "tcpRtoAlgorithm"
    oid = "1.3.6.1.2.1.6.1.0"

  # min restart time
  [[inputs.snmp.field]]
    name = "tcpRtoMin"
    oid = "1.3.6.1.2.1.6.2.0"

  # max restart time
  [[inputs.snmp.field]]
    name = "tcpRtoMax"
    oid = "1.3.6.1.2.1.6.3.0"

  # max połaczeń
  [[inputs.snmp.field]]
    name = "tcpMaxConn"
    oid = "1.3.6.1.2.1.6.4.0"

  [[inputs.snmp.field]]
    name = "udpInDatagrams"
    oid = "1.3.6.1.2.1.7.1.0"

  [[inputs.snmp.field]]
    name = "udpOutDatagrams"
    oid = "1.3.6.1.2.1.7.4.0"
   
  [[inputs.snmp.field]]
    name = "udpInErrors"
    oid = "1.3.6.1.2.1.7.3.0"