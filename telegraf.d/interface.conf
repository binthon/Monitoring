[[inputs.snmp]]
  agents = [ "10.250.249.165" ]
  version = 3
  sec_name = "${SNMP_SEC_NAME}"
  auth_protocol = "MD5"
  auth_password = "${SNMP_AUTH_PASS}"
  sec_level = "authPriv"
  priv_protocol = "DES"
  priv_password = "${SNMP_PRIV_PASS}"
  timeout = "5s"
  retries = 3

  name_prefix = "juniper_"

  [[inputs.snmp.table]]
    name = "interfaces"
    oid = "1.3.6.1.2.1.2.2"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "1.3.6.1.2.1.2.2.1.16"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"
