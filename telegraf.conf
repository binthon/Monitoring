[agent]
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  debug = false 
  quiet = false
  omit_hostname = true

# [[outputs.http]]
#   url = "http://victoriametrics:8428/api/v1/import/prometheus"
#   method = "POST"
#   data_format = "prometheus"

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"] 
  database = "telegraf"                  
  skip_database_creation = true         
  content_encoding = "gzip"             
  precision = "s"                    
