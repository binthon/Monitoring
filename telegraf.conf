[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = true

[[inputs.ping]]
  urls = ["8.8.8.8", "1.1.1.1"]
  count = 4
  ping_interval = 1.0
  timeout = 2.0
  deadline = 10
  method = "native"

[[inputs.snmp]]
  agents = [ "192.168.1.22" ]
  version = 2
  community = "public"
  name = "mikrotik"

  [[inputs.snmp.field]]
    name = "ifInOctets_ether3"
    oid = "1.3.6.1.2.1.2.2.1.10.3"

  [[inputs.snmp.field]]
    name = "ifOutOctets_ether3"
    oid = "1.3.6.1.2.1.2.2.1.16.3"

  [[inputs.snmp.field]]
    name = "ifInOctets_wlan1"
    oid = "1.3.6.1.2.1.2.2.1.10.6"

  [[inputs.snmp.field]]
    name = "used_memory"
    oid = ".1.3.6.1.2.1.25.2.3.1.6.65536"

  [[inputs.snmp.field]]
    name = "total_memory"
    oid = ".1.3.6.1.2.1.25.2.3.1.5.65536"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "cpu_frequency"
    oid = ".1.3.6.1.4.1.14988.1.1.3.14.0"

  [[inputs.snmp.field]]
    name = "build_time"
    oid = ".1.3.6.1.4.1.14988.1.1.7.6.0"

[[outputs.http]]
  url = "http://victoriametrics:8428/api/v1/import/prometheus"
  method = "POST"
  data_format = "prometheus"   # format tekstowym, nie natywny
